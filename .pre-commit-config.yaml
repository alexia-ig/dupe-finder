# All hooks are "local": they run the tools pinned in uv.lock (via `uv run`),
# so pre-commit, `make lint` and CI always use exactly the same versions.
default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: uv run --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff (format)
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy (strict)
        # Checks the whole configured scope (pyproject.toml), not only staged files,
        # so cross-module type errors are not missed.
        entry: uv run --no-sync mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: sqlfluff
        name: sqlfluff (lint dbt SQL)
        entry: uv run --no-sync sqlfluff lint
        language: system
        files: ^transform/.*\.sql$
        exclude: ^transform/(dbt_packages|target)/
