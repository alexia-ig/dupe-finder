[project]
name = "dupe-finder"
version = "0.0.0"
description = "Find the closest skincare and fragrance dupes, with an explainable similarity score."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Minor version pinned: dbt packages (dbt_utils, dbt_expectations) declare
    # compatible dbt ranges, so dbt upgrades are deliberate.
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "sqlfluff>=4.5.0",
]

[tool.uv]
# Virtual project: nothing is built or installed as a package yet.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["transform/dbt_packages", "transform/target", "notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations: type hints everywhere
    "RUF",  # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
# Whole repository: covers ingestion/, scoring/, api/, tests/ and any future Python folder.
# Listing folders explicitly would fail while they are still empty ("no .py[i] files").
files = ["."]
exclude = [
    '^\.venv/',
    '^transform/dbt_packages/',
    '^transform/target/',
    '^notebooks/',  # exploration only, never imported
    '^web/',        # TypeScript front, node_modules may ship .py files
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
