[project]
name = "dupe-finder"
version = "0.0.0"
description = "Find the closest skincare and fragrance dupes, with an explainable similarity score."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    # dbt-core is pinned to 1.11.x: 1.12 requires dbt-core-experimental-parser,
    # which ships as source only and fails to build on Windows (no wheel).
    "dbt-core>=1.11,<1.12",
    "dbt-duckdb>=1.11,<1.12",
]

[dependency-groups]
dev = [
    # mypy 2.x requires pathspec>=1.0, incompatible with dbt-core 1.11 (pathspec<0.13).
    "mypy>=1.19,<2",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "sqlfluff>=4.5.0",
]

[tool.uv]
# Virtual project: nothing is built or installed as a package yet.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["transform/dbt_packages", "transform/target", "notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations: type hints everywhere
    "RUF",  # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tests"]
exclude = ["transform/dbt_packages/", "transform/target/", "notebooks/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
